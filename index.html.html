    // =========================================================================
    // PERSISTENCE & APPLICATION STATE
    // =========================================================================
    function cloneDefaultMenu() {
      return DEFAULT_MENU_ITEMS.map((item) => ({ ...item }));
    }

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {
            lang: null,
            menuItems: cloneDefaultMenu(),
            unavailableItems: {},
            manualLocation: "",
            gpsCoords: null
          };
        }
        const parsed = JSON.parse(raw);
        const menuItems =
          Array.isArray(parsed.menuItems) && parsed.menuItems.length > 0
            ? parsed.menuItems.map((item) => ({
                id: String(item.id),
                category: CATEGORIES.some((c) => c.id === item.category && c.id !== "all")
                  ? item.category
                  : "grills",
                nameEn: String(item.nameEn || ""),
                nameAr: String(item.nameAr || ""),
                descEn: String(item.descEn || ""),
                descAr: String(item.descAr || ""),
                emoji: String(item.emoji || "🍽️"),
                imageUrl: String(item.imageUrl || ""),
                priceOmr: Number(item.priceOmr) > 0 ? Number(item.priceOmr) : 1.000
              }))
            : cloneDefaultMenu();

        return {
          lang: parsed.lang === "en" || parsed.lang === "ar" ? parsed.lang : null,
          menuItems,
          unavailableItems:
            parsed.unavailableItems && typeof parsed.unavailableItems === "object"
              ? parsed.unavailableItems
              : {},
          manualLocation: typeof parsed.manualLocation === "string" ? parsed.manualLocation : "",
          gpsCoords:
            parsed.gpsCoords &&
            typeof parsed.gpsCoords.lat === "number" &&
            typeof parsed.gpsCoords.lng === "number"
              ? parsed.gpsCoords
              : null
        };
      } catch (err) {
        return {
          lang: null,
          menuItems: cloneDefaultMenu(),
          unavailableItems: {},
          manualLocation: "",
          gpsCoords: null
        };
      }
    }

      customerPhone: "",
      formError: "",
      // Location capture state
      isLocationOpen: Boolean(saved.manualLocation || saved.gpsCoords),
      manualLocation: saved.manualLocation,
      gpsCoords: saved.gpsCoords,
      gpsState: saved.gpsCoords ? "success" : "idle", // "idle" | "loading" | "success" | "fallback"
      autoGpsAttempted: false,
      // Confirmed order summary
      confirmedOrder: null
    };

    function savePersistedState() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            lang: state.lang,
            menuItems: state.menuItems,
            unavailableItems: state.unavailableItems,
            manualLocation: state.manualLocation,
            gpsCoords: state.gpsCoords
          })
        );
      } catch (err) {
        // Ignore storage quota issues
      }
    }

    function t(key) {
      return I18N[state.lang][key] || key;
    }

    function formatOmr(amount) {
      const unit = state.lang === "ar" ? "ر.ع" : "OMR";
      return `${Number(amount || 0).toFixed(3)} ${unit}`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applyDocumentDirection() {
      const htmlEl = document.documentElement;
      htmlEl.lang = state.lang;
      htmlEl.dir = state.lang === "ar" ? "rtl" : "ltr";
    }

    // =========================================================================
    // LANGUAGE & BROWSE ACTIONS
    // =========================================================================
    function selectInitialLanguage(lang) {
      state.lang = lang;
      state.showEntryModal = false;
      savePersistedState();
      render();
    }

    function toggleLanguage() {
      state.lang = state.lang === "en" ? "ar" : "en";
      state.showEntryModal = false;
      savePersistedState();
      render();
    }

    function selectCategory(categoryId) {
      state.selectedCategory = categoryId;
      render();
    }

    function updateSearchQuery(query) {
      state.searchQuery = query;
      render();
      const input = document.getElementById("menuSearchInput");
      if (input) {
        input.focus();
        const len = input.value.length;
        input.setSelectionRange(len, len);
      }
    }

    function resetFilters() {
      state.selectedCategory = "all";
      state.searchQuery = "";
      render();
    }

    // =========================================================================
    // AUTOMATIC & MANUAL LOCATION CAPTURE
    // =========================================================================
    function detectGpsLocation(isAutomatic) {
      if (!navigator.geolocation) {
        state.gpsState = "fallback";
        render();
        return;
      }

      if (state.gpsState === "loading") return;

      state.gpsState = "loading";
      if (!isAutomatic) {
        render();
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.gpsCoords = {
            lat: Number(pos.coords.latitude.toFixed(6)),
            lng: Number(pos.coords.longitude.toFixed(6))
          };
          state.gpsState = "success";
          savePersistedState();
          render();
        },
        () => {
          state.gpsState = "fallback";
          render();
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    function autoOpenAndDetectLocation() {
      state.isLocationOpen = true;
      if (!state.gpsCoords && !state.autoGpsAttempted) {
        state.autoGpsAttempted = true;
        detectGpsLocation(true);
      }
    }

    function handleManualLocationInput(val) {
      state.manualLocation = val;
      state.formError = "";
      savePersistedState();
    }

    function getGoogleMapsPinUrl() {
      if (!state.gpsCoords) return "";
      return `https://maps.google.com/?q=${state.gpsCoords.lat},${state.gpsCoords.lng}`;
    }

    function getCombinedLocationString() {
      const parts = [];
      if (state.manualLocation.trim()) {
        parts.push(state.manualLocation.trim());
      }
      if (state.gpsCoords) {
        parts.push(`GPS: ${state.gpsCoords.lat}, ${state.gpsCoords.lng}`);
      }
      return parts.join(" | ");
    }

    // =========================================================================
    // CART, CHECKOUT & WHATSAPP ORDER FORMATTING
    // =========================================================================
    function addToCart(dishId) {
      if (state.unavailableItems[dishId]) return;
      state.confirmedOrder = null;
      state.formError = "";
      state.cart[dishId] = (state.cart[dishId] || 0) + 1;
      autoOpenAndDetectLocation();
      render();
    }

    function updateCartQty(dishId, delta) {
      if (state.unavailableItems[dishId] && delta > 0) return;
      const next = (state.cart[dishId] || 0) + delta;
      if (next <= 0) {
        delete state.cart[dishId];
      } else {
        state.cart[dishId] = next;
        autoOpenAndDetectLocation();
      }
      state.formError = "";
      render();
    }

    function setDeliveryFee(fee) {
      state.deliveryFee = Number(fee);
      render();
    }

    function setPaymentMethod(method) {
      state.paymentMethod = method;
      render();
    }

    function calculateOrderTotals() {
      const items = [];
      let subtotal = 0;

      for (const dish of state.menuItems) {
        const qty = state.cart[dish.id] || 0;
        if (qty > 0 && !state.unavailableItems[dish.id]) {
          const lineTotal = dish.priceOmr * qty;
          subtotal += lineTotal;
          items.push({ dish, qty, lineTotal });
        }
      }

      const hasItems = items.length > 0;
      const delivery = hasItems ? state.deliveryFee : 0;
      const codSurcharge = hasItems && state.paymentMethod === "cod" ? COD_SURCHARGE : 0;
      const total = subtotal + delivery + codSurcharge;

      return { items, hasItems, subtotal, delivery, codSurcharge, total };
    }

    function buildWhatsAppOrderUrl(order) {
      const isAr = state.lang === "ar";
      const lines = [
        `*${t("waHeader")}*`,
        `${t("waOrderRef")}: #${order.ref}`,
        `${t("waCustomer")}: ${order.customerName}`,
        `${t("waPhone")}: ${order.customerPhone}`,
        `${t("waLocation")}: ${order.locationText}`
      ];

      if (order.mapUrl) {
        lines.push(`${t("waMapLink")}: ${order.mapUrl}`);
      }

      lines.push("", `*${t("waItems")}:*`);
      order.items.forEach((entry) => {
        const title = isAr
          ? `${entry.dish.nameAr} (${entry.dish.nameEn})`
          : `${entry.dish.nameEn} (${entry.dish.nameAr})`;
        lines.push(`• ${title} x${entry.qty} = ${entry.lineTotal.toFixed(3)} OMR`);
      });

      lines.push(
        "",
        `${t("waSubtotal")}: ${order.subtotal.toFixed(3)} OMR`,
        `${t("waDelivery")}: ${order.delivery.toFixed(3)} OMR`
      );

      if (order.codSurcharge > 0) {
        lines.push(`${t("waCodFee")}: +${order.codSurcharge.toFixed(3)} OMR`);
      }

      const paymentLabel =
        order.paymentMethod === "transfer"
          ? `${t("paymentTransferTitle")} (${TRANSFER_NUMBER})`
          : t("paymentCodTitle");

      lines.push(
        `*${t("waTotal")}: ${order.total.toFixed(3)} OMR*`,
        `${t("waPayment")}: ${paymentLabel}`,
        `${t("waDeliveryNote")}`
      );

      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(lines.join("\n"))}`;
    }

    function placeOrder(event) {
      event.preventDefault();
      autoOpenAndDetectLocation();

      const nameEl = document.getElementById("customerNameInput");
      const phoneEl = document.getElementById("customerPhoneInput");
      const locEl = document.getElementById("manualLocationInput");

      if (nameEl) state.customerName = nameEl.value.trim();
      if (phoneEl) state.customerPhone = phoneEl.value.trim();
      if (locEl) {
        state.manualLocation = locEl.value.trim();
        savePersistedState();
      }

      const locationText = getCombinedLocationString();
      const { items, hasItems, subtotal, delivery, codSurcharge, total } = calculateOrderTotals();

      if (!hasItems || !state.customerName || !state.customerPhone || !locationText) {
        state.formError = t("validationError");
        render();
        return;
      }

      const ref = `OFM-${Math.floor(1000 + Math.random() * 9000)}`;
      const confirmed = {
        ref,
        customerName: state.customerName,
        customerPhone: state.customerPhone,
        locationText,
        mapUrl: getGoogleMapsPinUrl(),
        items,
        subtotal,
        delivery,
        codSurcharge,
        total,
        paymentMethod: state.paymentMethod
      };

      const whatsappUrl = buildWhatsAppOrderUrl(confirmed);
      window.open(whatsappUrl, "_blank", "noopener,noreferrer");

      state.confirmedOrder = confirmed;
      state.cart = {};
      state.formError = "";
      render();
    }

    function startAnotherOrder() {
      state.confirmedOrder = null;
      state.formError = "";
      render();
    }

      state.isAdminModalOpen = true;

      event.preventDefault();

      if (value === ADMIN_PASSWORD) {
        state.isAdminUnlocked = true;

    function toggleItemAvailability(dishId) {
      if (!state.isAdminUnlocked) return;
      if (state.unavailableItems[dishId]) {
        delete state.unavailableItems[dishId];
      } else {
        state.unavailableItems[dishId] = true;
        delete state.cart[dishId];
      }
      savePersistedState();
      render();
    }

    function turnAllItemsOn() {
      if (!state.isAdminUnlocked) return;
      state.unavailableItems = {};

      render();

    function turnAllItemsOff() {
      if (!state.isAdminUnlocked) return;
      for (const dish of state.menuItems) {
        state.unavailableItems[dish.id] = true;
      }
      state.cart = {};
      savePersistedState();
      render();
    }

    function deleteMenuItem(dishId) {
      if (!state.isAdminUnlocked) return;
      state.menuItems = state.menuItems.filter((item) => item.id !== dishId);
      delete state.unavailableItems[dishId];
      delete state.cart[dishId];
      savePersistedState();
      render();
    }

    function handleNewDishPhotoFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.newDish.uploadedDataUrl = String(reader.result || "");
        state.newDish.error = "";
        render();
      };
      reader.readAsDataURL(file);
    }

    function addNewDish(event) {
      event.preventDefault();
      if (!state.isAdminUnlocked) return;

      const nameEnEl = document.getElementById("newDishNameEn");
      const nameArEl = document.getElementById("newDishNameAr");
      const categoryEl = document.getElementById("newDishCategory");
      const priceEl = document.getElementById("newDishPrice");
      const descEnEl = document.getElementById("newDishDescEn");
      const descArEl = document.getElementById("newDishDescAr");
      const urlEl = document.getElementById("newDishImageUrl");

      const nameEn = (nameEnEl ? nameEnEl.value : state.newDish.nameEn).trim();
      const nameAr = (nameArEl ? nameArEl.value : state.newDish.nameAr).trim();
      const category = categoryEl ? categoryEl.value : state.newDish.category;
      const rawPrice = parseFloat(priceEl ? priceEl.value : state.newDish.priceOmr);
      const descEn = (descEnEl ? descEnEl.value : state.newDish.descEn).trim();
      const descAr = (descArEl ? descArEl.value : state.newDish.descAr).trim();
      const imageUrl = (
        state.newDish.uploadedDataUrl ||
        (urlEl ? urlEl.value : state.newDish.imageUrl)
      ).trim();

      if (!nameEn || !nameAr || Number.isNaN(rawPrice) || rawPrice <= 0) {
        state.newDish.error = t("addDishValidationError");
        render();
        return;
      }

      state.menuItems.unshift({
        id: `dish-${Date.now()}`,
        category,
        nameEn,
        nameAr,
        descEn: descEn || "Freshly prepared daily in our kitchen.",
        descAr: descAr || "يُحضّر طازجاً يومياً في مطبخنا.",
        emoji: state.newDish.emoji || "🍽️",
        imageUrl,
        priceOmr: Number(rawPrice.toFixed(3))
      });

      state.newDish = {
        nameEn: "",
        nameAr: "",
        category: "grills",
        priceOmr: "",
        descEn: "",
        descAr: "",
        imageUrl: "",
        uploadedDataUrl: "",
        emoji: "🍽️",
        error: ""
      };

      savePersistedState();
      render();
    }

                  type="text"
                  value="${escapeHtml(state.newDish.nameAr)}"
                  oninput="state.newDish.nameAr = this.value"
                  placeholder="${escapeHtml(t("dishNameArPlaceholder"))}"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm"
                />
              </div>

              <div class="space-y-1">
                <label for="newDishCategory" class="block text-xs font-bold text-slate-700">
                  ${t("dishCategoryLabel")}
                </label>
                <select
                  id="newDishCategory"
                  onchange="state.newDish.category = this.value"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 bg-white text-sm"
                >
                  ${CATEGORIES.filter((c) => c.id !== "all")
                    .map(
                      (c) => `
                        <option value="${c.id}" ${state.newDish.category === c.id ? "selected" : ""}>
                          ${escapeHtml(isAr ? c.labelAr : c.labelEn)}
                        </option>
                      `
                    )
                    .join("")}
                </select>
              </div>

              <div class="space-y-1">
                <label for="newDishPrice" class="block text-xs font-bold text-slate-700">
                  ${t("dishPriceLabel")}
                </label>
                <input
                  id="newDishPrice"
                  type="number"
                  step="0.001"
                  min="0.050"
                  value="${escapeHtml(state.newDish.priceOmr)}"
                  oninput="state.newDish.priceOmr = this.value"
                  placeholder="${escapeHtml(t("dishPricePlaceholder"))}"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm"
                />
              </div>

              <div class="space-y-1">
                <label for="newDishDescEn" class="block text-xs font-bold text-slate-700">
                  ${t("dishDescEnLabel")}
                </label>
                <input
                  id="newDishDescEn"
                  type="text"
                  value="${escapeHtml(state.newDish.descEn)}"
                  oninput="state.newDish.descEn = this.value"
                  placeholder="${escapeHtml(t("dishDescEnPlaceholder"))}"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm"
                />
              </div>

              <div class="space-y-1">
                <label for="newDishDescAr" class="block text-xs font-bold text-slate-700">
                  ${t("dishDescArLabel")}
                </label>
                <input
                  id="newDishDescAr"
                  type="text"
                  value="${escapeHtml(state.newDish.descAr)}"
                  oninput="state.newDish.descAr = this.value"
                  placeholder="${escapeHtml(t("dishDescArPlaceholder"))}"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm"
                />
              </div>

              <div class="space-y-1">
                <label for="newDishPhotoFile" class="block text-xs font-bold text-slate-700">
                  ${t("dishPhotoUploadLabel")}
                </label>
                <input
                  id="newDishPhotoFile"
                  type="file"
                  accept="image/*"
                  onchange="handleNewDishPhotoFile(event)"
                  class="w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-emerald-50 file:text-emerald-900 file:font-bold"
                />
              </div>

              <div class="space-y-1">
                <label for="newDishImageUrl" class="block text-xs font-bold text-slate-700">
                  ${t("dishPhotoUrlLabel")}
                </label>
                <input
                  id="newDishImageUrl"
                  type="url"
                  value="${escapeHtml(state.newDish.imageUrl)}"
                  oninput="state.newDish.imageUrl = this.value"
                  placeholder="${escapeHtml(t("dishPhotoUrlPlaceholder"))}"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm"
                />
              </div>
            </div>

            <div class="space-y-1.5">
              <span class="block text-xs font-bold text-slate-700">${t("dishEmojiLabel")}</span>
              <div class="flex flex-wrap gap-1.5">
                ${EMOJI_CHOICES.map(
                  (em) => `
                    <button
                      type="button"
                      onclick="state.newDish.emoji = '${em}'; render();"
                      class="w-9 h-9 rounded-xl border text-lg flex items-center justify-center transition ${
                        state.newDish.emoji === em
                          ? "bg-emerald-100 border-emerald-700"
                          : "bg-stone-50 border-stone-200 hover:bg-amber-50"
                      }"
                    >
                      ${em}
                    </button>
                  `
                ).join("")}
              </div>
            </div>

            ${
              previewPhoto
                ? `
                  <div class="w-24 h-24 rounded-2xl overflow-hidden border border-stone-200">
                    <img src="${escapeHtml(previewPhoto)}" alt="Preview" class="w-full h-full object-cover" />
                  </div>
                `
                : ""
            }

            ${
              state.newDish.error
                ? `<p class="text-xs font-semibold text-rose-700">${escapeHtml(state.newDish.error)}</p>`
                : ""
            }

            <button
              type="submit"
              class="px-5 py-3 rounded-2xl bg-emerald-800 hover:bg-emerald-900 text-white font-extrabold text-sm transition"
            >
              ${t("addDishSubmitBtn")}
            </button>
          </form>
        </section>
      `;
    }

    function renderAdminPasswordModal() {
      if (!state.isAdminModalOpen) return "";

      return `
        <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-stone-200 space-y-4">
            <div class="space-y-1">
              <h3 class="text-lg font-extrabold text-slate-900">
                🔒 ${t("adminModalTitle")}
              </h3>
              <p class="text-xs sm:text-sm text-slate-600">
                ${t("adminModalDesc")}
              </p>
            </div>

            <form onsubmit="submitAdminLogin(event)" class="space-y-4">
              <div class="space-y-1">
                <label for="adminPasswordInput" class="block text-xs font-bold text-slate-700">
                  ${t("adminPasswordLabel")}
                </label>
                <input
                  id="adminPasswordInput"
                  type="password"
                  inputmode="numeric"
                  autocomplete="off"
                  value="${escapeHtml(state.adminPasswordInput)}"
                  oninput="state.adminPasswordInput = this.value"
                  placeholder="${escapeHtml(t("adminPasswordPlaceholder"))}"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600"
                />
              </div>

              ${
                state.adminPasswordError
                  ? `
                    <p class="text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-2.5">
                      ${escapeHtml(state.adminPasswordError)}
                    </p>
                  `
                  : ""
              }

              <div class="flex items-center justify-end gap-2">
                <button
                  type="button"
                  onclick="closeAdminModal()"
                  class="px-4 py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 font-bold text-xs sm:text-sm transition"
                >
                  ${t("adminCancelBtn")}
                </button>
                <button
                  type="submit"
                  class="px-5 py-2.5 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white font-extrabold text-xs sm:text-sm transition"
                >
                  ${t("adminUnlockBtn")}
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function render() {
      applyDocumentDirection();
      const filteredDishes = getFilteredMenuItems();
      const appEl = document.getElementById("app");

      appEl.innerHTML = `
        ${renderEntryLanguageModal()}
        ${renderHeader()}

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- Left / Main Menu & Admin Column -->
            <div class="lg:col-span-7 xl:col-span-8 space-y-5">
              ${renderFilterAndSearchBar()}

              ${
                filteredDishes.length === 0
                  ? `
                    <div class="bg-white rounded-3xl border border-stone-200 p-10 text-center space-y-3">
                      <div class="text-4xl">🍽️</div>
                      <p class="text-sm font-bold text-slate-700">${t("noDishesFound")}</p>
                      <button
                        type="button"
                        onclick="resetFilters()"
                        class="px-4 py-2 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-bold transition"
                      >
                        ${t("resetFiltersBtn")}
                      </button>
                    </div>
                  `
                  : `
                    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      ${filteredDishes.map(renderFoodCard).join("")}
                    </section>
                  `
              }

              ${renderAdminControlsSection()}
            </div>

            <!-- Right Sticky Order & Checkout Column -->
            <aside class="lg:col-span-5 xl:col-span-4">
              ${renderCheckoutAndSummaryPanel()}
            </aside>
          </div>
        </main>

        ${renderAdminPasswordModal()}
      `;
    }

    // Initial render
    render();
  </script>
</body>
</html>
